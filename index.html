
<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AMBAR AI</title>
<style>
*{box-sizing:border-box}
body{
margin:0;
background:#10131c;
color:white;
font-family:Arial,sans-serif;
display:flex;
justify-content:center;
min-height:100vh;
}
.app{
width:100%;
max-width:500px;
display:flex;
flex-direction:column;
height:100vh;
}
header{
padding:24px;
background:#191f2e;
text-align:center;
border-bottom:1px solid #30384b;
}
h1{color:#e6ad43;margin:0;font-size:30px}
header p{color:#aaa;margin-bottom:0}
#chat{flex:1;overflow-y:auto;padding:18px}
.msg{
padding:13px 16px;
border-radius:15px;
margin:12px 0;
max-width:85%;
line-height:1.5;
}
.bot{background:#252d40;margin-right:auto}
.user{background:#a66c16;margin-left:auto}
.controls{
display:flex;
gap:8px;
padding:14px;
background:#191f2e;
}
input{
flex:1;
min-width:0;
padding:14px;
border-radius:12px;
border:1px solid #414b60;
background:#252d40;
color:white;
font-size:16px;
}
button{
border:0;
border-radius:12px;
padding:12px;
background:#d99b32;
color:#171717;
font-weight:bold;
}
</style>
</head>
<body>
<div class="app">
<header>
<h1>AMBAR AI</h1>
<p>Erzincanlı Gardaşın Yanında!</p>
</header>

<div id="chat">
<div class="msg bot">
Ula Ambar gardaş, hoş geldin! Nörüyon, nasılsın? Ben burdayım, ne derdin varsa anlat hele.
</div>
</div>

<div class="controls">
<input id="message" placeholder="Gardaşına bir şey yaz...">
<button onclick="send()">Gönder</button>
<button onclick="listen()">🎤</button>
</div>
</div>

<script>
const chat=document.getElementById("chat");
const input=document.getElementById("message");

function add(text,type){
const div=document.createElement("div");
div.className="msg "+type;
div.textContent=text;
chat.appendChild(div);
chat.scrollTop=chat.scrollHeight;
}

function send(){
const text=input.value.trim();
if(!text)return;

add(text,"user");
input.value="";

setTimeout(()=>{
let answer="Ula Ambar gardaş, hele anlat bakalım. Seni dinliyirem!";

if(/merhaba|selam|nasılsın|naber/i.test(text)){
answer="Eyvallah gardaş! İyiyem, sen nasılsın? Erzincan'dan selam olsun!";
}
else if(/adın ne/i.test(text)){
answer="Ben AMBAR AI'yım gardaş. Senin Erzincanlı dijital yardımcınım!";
}
else if(/teşekkür/i.test(text)){
answer="Ne demek Ambar gardaş, her zaman yanındayım!";
}

add(answer,"bot");
},500);
}

input.addEventListener("keydown",e=>{
if(e.key==="Enter")send();
});

function listen(){
const Speech=window.SpeechRecognition||window.webkitSpeechRecognition;

if(!Speech){
add("Gardaş, bu tarayıcı sesli konuşmayı desteklemiyor.","bot");
return;
}

const rec=new Speech();
rec.lang="tr-TR";

rec.onresult=e=>{
input.value=e.results[0][0].transcript;
send();
};

rec.start();
}
</script>
</body>
</html>
